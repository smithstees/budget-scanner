name: Scanner evidence review

# Deliberately manual. There was no active schedule in the previous workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner-data-writes
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Observe exact option contracts
        run: python observe_quotes.py
      - name: Review quoted paper outcomes
        run: python backtest_review.py
      - name: Preserve public quote evidence for the next review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/review.json
          if [ -f option_quotes.jsonl ]; then git add -f option_quotes.jsonl; fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: preserve public paper quote evidence [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve evidence
        uses: actions/upload-artifact@v4
        with:
          name: scanner-evidence
          path: |
            reports/
            option_quotes.jsonl
          if-no-files-found: error
          retention-days: 90
