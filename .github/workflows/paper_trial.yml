name: Fifty-signal paper trial
on:
  push:
    branches: [main]
    paths: [paper_trial.py, .github/workflows/paper_trial.yml]
  schedule:
    # Hourly observations; runtime checks ET to handle daylight saving changes.
    - cron: '0 14-21 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scanner-data-writes
  cancel-in-progress: false
jobs:
  trial:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python paper_trial.py
      - name: Save paper experiment only
        run: |
          if [ -d reports/paper-trial ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add reports/paper-trial
            if ! git diff --cached --quiet; then
              git commit -m 'chore: record finite paper trial observations [skip ci]'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
