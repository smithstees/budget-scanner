name: Fifty-signal paper trial
on:
  push:
    branches: [main]
    paths: [paper_trial.py, paper_data_probe.py, market_data.py, live_scanner.py, scanner_quality.py, .github/workflows/paper_trial.yml]
  schedule:
    # Hourly observations; runtime checks ET to handle daylight saving changes.
    - cron: '47 13-20 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scanner-data-writes
  cancel-in-progress: false
jobs:
  trial:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: .market-data-cache
          key: public-market-history-${{ github.run_id }}
          restore-keys: public-market-history-
      - run: python paper_trial.py
      - name: Small daily data-health probe (not a paper trade)
        run: python paper_data_probe.py
      - name: Save paper experiment only
        if: always()
        run: |
          if [ -d reports/paper-trial ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add reports/paper-trial
            if ! git diff --cached --quiet; then
              git commit -m 'chore: record finite paper trial observations [skip ci]'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
